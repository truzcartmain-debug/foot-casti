<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FootCasti — Watch Live Sports</title>
  <meta name="description" content="Watch live sports streams on FootCasti. One click takes you straight to the live streams." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322c55e'/%3E%3Cstop offset='1' stop-color='%230ea5e9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%2304140a' stroke-width='4'/%3E%3Cpath d='M28 25 L40 32 L28 39 Z' fill='%2304140a'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0b0f14;
      --card: #12181f;
      --border: #22303c;
      --text: #e8eef4;
      --muted: #93a4b3;
      --primary: #22c55e;
      --primary-hover: #16a34a;
      --primary-text: #04140a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(60rem 30rem at 50% -10%, rgba(34,197,94,0.12), transparent 60%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      position: sticky;
      top: 0;
      border-bottom: 1px solid var(--border);
      background: rgba(18, 24, 31, 0.85);
      backdrop-filter: blur(8px);
    }
    .header-inner {
      max-width: 72rem;
      margin: 0 auto;
      height: 4rem;
      padding: 0 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: -0.01em;
      color: var(--text);
      text-decoration: none;
    }
    .logo { width: 2.4rem; height: 2.4rem; filter: drop-shadow(0 0 8px rgba(34,197,94,0.55)); }
    .brand span.grad {
      background: linear-gradient(90deg, #22c55e, #0ea5e9);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--primary);
      color: var(--primary-text);
      font-weight: 600;
      border: none;
      border-radius: 0.5rem;
      padding: 0.55rem 1.1rem;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-lg { padding: 0.9rem 2.5rem; font-size: 1.15rem; border-radius: 0.65rem; }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
    }
    .hero-logo {
      width: 6.5rem;
      height: 6.5rem;
      margin: 0 auto 1.25rem;
      filter: drop-shadow(0 0 24px rgba(34,197,94,0.45));
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid rgba(34, 197, 94, 0.35);
      background: rgba(34, 197, 94, 0.12);
      color: var(--primary);
      border-radius: 999px;
      padding: 0.35rem 1rem;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .dot {
      width: 0.5rem; height: 0.5rem;
      border-radius: 999px;
      background: var(--primary);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    h1 { font-size: clamp(2.4rem, 6vw, 3.8rem); font-weight: 800; letter-spacing: -0.02em; margin-top: 1.5rem; }
    h1 span { color: var(--primary); }
    p.sub { color: var(--muted); max-width: 28rem; margin: 1rem auto 0; font-size: 1.05rem; line-height: 1.6; }
    .hero-btn { margin-top: 2rem; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="/">
        <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#22c55e"/>
              <stop offset="1" stop-color="#0ea5e9"/>
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="14" fill="url(#lg1)"/>
          <circle cx="32" cy="32" r="15" fill="none" stroke="#04140a" stroke-width="4"/>
          <path d="M28 25 L40 32 L28 39 Z" fill="#04140a"/>
        </svg>
        Foot<span class="grad">Casti</span>
      </a>
      <a class="btn" href="https://footcastihome.vercel.app/">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        Watch
      </a>
    </div>
  </header>

  <main>
    <div>
      <svg class="hero-logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#22c55e"/>
            <stop offset="1" stop-color="#0ea5e9"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="14" fill="url(#lg2)"/>
        <circle cx="32" cy="32" r="15" fill="none" stroke="#04140a" stroke-width="4"/>
        <path d="M28 25 L40 32 L28 39 Z" fill="#04140a"/>
      </svg>
      <span class="badge"><span class="dot"></span> Streaming 24/7</span>
      <h1>Watch Live <span>Sports</span></h1>
      <p class="sub">One click takes you straight to the live streams — football, UEFA, baseball, UFC and more.</p>
      <div class="hero-btn">
        <a class="btn btn-lg" href="https://footcastihome.vercel.app/">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
          Watch
        </a>
      </div>
    </div>
  </main>
</body>
</html>
