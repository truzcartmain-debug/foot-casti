<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FootCasti — Watch Live Sports</title>
  <meta name="description" content="Watch live sports streams on FootCasti. One click takes you straight to the live streams." />
  <style>
    :root {
      --bg: #0b0f14;
      --card: #12181f;
      --border: #22303c;
      --text: #e8eef4;
      --muted: #93a4b3;
      --primary: #22c55e;
      --primary-hover: #16a34a;
      --primary-text: #04140a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      position: sticky;
      top: 0;
      border-bottom: 1px solid var(--border);
      background: rgba(18, 24, 31, 0.85);
      backdrop-filter: blur(8px);
    }
    .header-inner {
      max-width: 72rem;
      margin: 0 auto;
      height: 4rem;
      padding: 0 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text);
      text-decoration: none;
    }
    .brand-icon {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 0.5rem;
      background: var(--primary);
      color: var(--primary-text);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--primary);
      color: var(--primary-text);
      font-weight: 600;
      border: none;
      border-radius: 0.5rem;
      padding: 0.55rem 1.1rem;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-lg { padding: 0.9rem 2.5rem; font-size: 1.15rem; border-radius: 0.65rem; }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid rgba(34, 197, 94, 0.35);
      background: rgba(34, 197, 94, 0.12);
      color: var(--primary);
      border-radius: 999px;
      padding: 0.35rem 1rem;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .dot {
      width: 0.5rem; height: 0.5rem;
      border-radius: 999px;
      background: var(--primary);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    h1 { font-size: clamp(2.4rem, 6vw, 3.8rem); font-weight: 800; letter-spacing: -0.02em; margin-top: 1.5rem; }
    h1 span { color: var(--primary); }
    p.sub { color: var(--muted); max-width: 28rem; margin: 1rem auto 0; font-size: 1.05rem; line-height: 1.6; }
    .hero-btn { margin-top: 2rem; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="/">
        <span class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="15" x="2" y="7" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>
        </span>
        FootCasti
      </a>
      <a class="btn" href="https://footcastihome.vercel.app/">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        Watch
      </a>
    </div>
  </header>

  <main>
    <div>
      <span class="badge"><span class="dot"></span> Streaming 24/7</span>
      <h1>Watch Live <span>Sports</span></h1>
      <p class="sub">One click takes you straight to the live streams — football, UEFA, baseball, UFC and more.</p>
      <div class="hero-btn">
        <a class="btn btn-lg" href="https://footcastihome.vercel.app/">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
          Watch
        </a>
      </div>
    </div>
  </main>
</body>
</html>
