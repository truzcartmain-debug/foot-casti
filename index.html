<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FootCasti — Watch Live Sports</title>
  <meta name="description" content="Watch live sports streams on FootCasti. One click to open the live stream player.">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="apple-touch-icon" href="logo.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b1220;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    img { width: 120px; height: 120px; margin-bottom: 24px; }
    h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.02em; }
    span { background: linear-gradient(90deg, #22c55e, #0ea5e9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: #94a3b8; max-width: 360px; margin: 12px auto 28px; line-height: 1.5; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(90deg, #22c55e, #0ea5e9);
      color: #04140a;
      text-decoration: none;
      font-weight: 700;
      padding: 14px 36px;
      border-radius: 999px;
      font-size: 1.1rem;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    a:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(34, 197, 94, .35); }
    footer { position: absolute; bottom: 20px; color: #64748b; font-size: .85rem; }
    @media (max-width: 480px) { h1 { font-size: 1.9rem; } img { width: 96px; height: 96px; } }
  </style>
</head>
<body>
  <img src="logo.svg" alt="FootCasti logo">
  <h1>Foot<span>Casti</span></h1>
  <p>Watch live sports streams. One click takes you straight to the action.</p>
  <a href="https://footcastihome.vercel.app/">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    Watch Now
  </a>
  <footer>FootCasti &copy; 2026</footer>
</body>
</html>
